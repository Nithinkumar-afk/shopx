<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Users | JD</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;
  --card:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.15);
  --text:#e5e7eb;
  --muted:#94a3b8;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Poppins,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ================= HEADER ================= */
header{
  padding:18px 22px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
}

header h2{
  font-size:18px;
  font-weight:600;
}

header a{
  color:#fff;
  text-decoration:none;
  font-size:14px;
  opacity:.9;
}

/* ================= NAV ================= */
.nav{
  display:flex;
  gap:12px;
  padding:16px 22px;
  flex-wrap:wrap;
}

.nav a{
  text-decoration:none;
  color:#fff;
  padding:12px 18px;
  border-radius:16px;
  background:var(--card);
  border:1px solid var(--border);
  font-size:14px;
  white-space:nowrap;
}

/* ================= SECTION ================= */
.section{
  padding:24px 22px;
  max-width:1200px;
  margin:auto;
}

.section h3{
  margin-bottom:16px;
  font-size:16px;
  font-weight:600;
}

/* ================= USER CARD ================= */
.user-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:18px;
  margin-bottom:16px;
  display:flex;
  gap:18px;
  align-items:center;
}

.user-img{
  width:80px;
  height:80px;
  border-radius:50%;
  background:#020617;
  overflow:hidden;
  flex-shrink:0;
  border:1px solid var(--border);
}

.user-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.user-info p{
  margin-bottom:6px;
  font-size:14px;
  color:var(--muted);
}

.user-info strong{
  color:#fff;
}

/* ================= MOBILE ================= */
@media(max-width:600px){
  header{
    flex-direction:column;
    align-items:flex-start;
  }

  header h2{
    font-size:16px;
  }

  .nav{
    padding:12px;
    gap:10px;
  }

  .nav a{
    flex:1;
    text-align:center;
  }

  .section{
    padding:16px 14px;
  }

  .user-card{
    flex-direction:column;
    align-items:flex-start;
    gap:14px;
  }

  .user-img{
    width:70px;
    height:70px;
  }

  .user-info p{
    font-size:13px;
  }
}

/* ================= TABLET ================= */
@media(min-width:601px) and (max-width:1024px){
  .user-card{
    padding:16px;
  }
}
</style>
</head>

<body>

<header>
  <h2>JD Admin – Users</h2>
  <a href="admin-dashboard.html">← Dashboard</a>
</header>

<div class="nav">
  <a href="admin-products.html">📦 Products</a>
  <a href="admin-orders.html">📑 Orders</a>
  <a href="admin-users.html">👥 Users</a>
</div>

<div class="section">
  <h3>All Users</h3>
  <div id="usersList">Loading users...</div>
</div>

<script>
/* ================================
   CONFIG
================================ */
const API = "http://localhost:5000";
const usersList = document.getElementById("usersList");

/* ================================
   XSS SAFE ESCAPE
================================ */
function esc(str){
  return String(str || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

/* ================================
   LOAD USERS
================================ */
async function loadUsers(){
  try{
    const res = await fetch(API + "/api/admin/users");
    const users = await res.json();

    usersList.innerHTML = "";

    if(!Array.isArray(users) || users.length === 0){
      usersList.innerHTML = `
        <div style="opacity:.6;margin-top:12px">
          No users have visited yet.
        </div>
      `;
      return;
    }

    users.forEach(u => {
      usersList.innerHTML += `
        <div class="user-card">
          <div class="user-img">
            <img 
              src="${u.image ? API + u.image : 'https://via.placeholder.com/80?text=User'}"
              alt="User"
            >
          </div>
          <div class="user-info">
            <p><strong>${esc(u.name) || "Guest User"}</strong></p>
            <p>📞 Phone: ${esc(u.phone) || "-"}</p>
            <p>📱 Alt Phone: ${esc(u.alt_phone) || "-"}</p>
            <p>🏠 Address: ${esc(u.address_line) || "-"}</p>
          </div>
        </div>
      `;
    });

  }catch(error){
    usersList.innerHTML =
      "<p style='color:#f87171'>Failed to load users</p>";
  }
}

/* ================================
   INIT
================================ */
loadUsers();
</script>

</body>
</html>
