<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin – Products | JD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:radial-gradient(circle at top,#0b0b0b,#000);
  color:#e5e7eb;
}
header{
  padding:18px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(20,20,20,.85);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
header h2{margin:0;font-size:18px}
header button{
  padding:10px 18px;
  border-radius:14px;
  border:none;
  background:#2563eb;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}
.form{
  margin:18px;
  padding:18px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;
  background:rgba(255,255,255,.05);
  border-radius:22px;
}
input,textarea{
  padding:13px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.12);
  background:#000;
  color:#fff;
}
textarea{grid-column:1/-1}
.form button{
  grid-column:1/-1;
  padding:15px;
  border-radius:16px;
  border:none;
  background:#22c55e;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}
.products{
  padding:18px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:18px;
}
.card{
  background:rgba(255,255,255,.06);
  border-radius:22px;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.card img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:16px;
  background:#111;
}
.card button{
  margin-top:auto;
  padding:10px;
  border:none;
  border-radius:14px;
  background:#ef4444;
  color:#fff;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <h2>JD Product Management</h2>
  <button onclick="location.href='admin-dashboard.html'">Dashboard</button>
</header>

<div class="form">
  <input id="name" placeholder="Product name">
  <input id="price" type="number" placeholder="Price">
  <input id="category" placeholder="Category">
  <input id="img1" placeholder="Cloudinary / ImageKit URL 1">
  <input id="img2" placeholder="Cloudinary / ImageKit URL 2 (optional)">
  <input id="img3" placeholder="Cloudinary / ImageKit URL 3 (optional)">
  <textarea id="desc" rows="3" placeholder="Description (optional)"></textarea>
  <button id="addBtn">Add Product</button>
</div>

<div class="products" id="list"></div>

<script>
const API = "https://shopx-production-b1ad.up.railway.app/api";
const PUBLIC_API = API + "/products";
const ADMIN_API = API + "/admin/products";

const FALLBACK =
  "https://via.placeholder.com/600x400?text=No+Image";

const token = localStorage.getItem("adminToken");
if(!token) location.href="admin-login.html";

const list = document.getElementById("list");
const addBtn = document.getElementById("addBtn");

const nameI = nameInput = document.getElementById("name");
const priceI = document.getElementById("price");
const catI = document.getElementById("category");
const img1I = document.getElementById("img1");
const img2I = document.getElementById("img2");
const img3I = document.getElementById("img3");
const descI = document.getElementById("desc");

const isValidImageURL = url =>
  /^https:\/\/(res\.cloudinary\.com|ik\.imagekit\.io)\//.test(url);

async function loadProducts(){
  list.innerHTML="";
  const res = await fetch(PUBLIC_API);
  const products = await res.json();

  products.forEach(p=>{
    const img = Array.isArray(p.images) && p.images[0]
      ? p.images[0]
      : FALLBACK;

    const card = document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <img src="${img}" onerror="this.src='${FALLBACK}'">
      <strong>${p.name}</strong>
      <span>₹${p.price}</span>
      <small>${p.category}</small>
      <button>Delete</button>
    `;
    card.querySelector("button").onclick=()=>deleteProduct(p.id);
    list.appendChild(card);
  });
}

addBtn.onclick = async ()=>{
  const images = [img1I.value,img2I.value,img3I.value]
    .map(i=>i.trim())
    .filter(i=>i && isValidImageURL(i));

  if(!nameI.value || !catI.value || !priceI.value){
    return alert("Name, price & category required");
  }
  if(!images.length){
    return alert("At least ONE Cloudinary / ImageKit image required");
  }

  const res = await fetch(ADMIN_API,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization:"Bearer "+token
    },
    body:JSON.stringify({
      name:nameI.value.trim(),
      price:Number(priceI.value),
      category:catI.value.trim(),
      description:descI.value.trim(),
      images
    })
  });

  const data = await res.json();
  if(!res.ok) return alert(data.message);

  [nameI,priceI,catI,img1I,img2I,img3I,descI].forEach(i=>i.value="");
  loadProducts();
};

async function deleteProduct(id){
  if(!confirm("Delete product?")) return;
  await fetch(`${ADMIN_API}/${id}`,{
    method:"DELETE",
    headers:{Authorization:"Bearer "+token}
  });
  loadProducts();
}

loadProducts();
</script>

</body>
</html>
