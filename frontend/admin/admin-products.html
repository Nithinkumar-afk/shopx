<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin – Products | JD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:radial-gradient(circle at top,#0b0b0b,#000);
  color:#e5e7eb;
}

/* HEADER */
header{
  padding:18px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(20,20,20,.85);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
header h2{margin:0;font-size:18px}
header button{
  padding:10px 18px;
  border-radius:14px;
  border:none;
  background:#2563eb;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

/* FORM */
.form{
  margin:18px;
  padding:18px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;
  background:rgba(255,255,255,.05);
  border-radius:22px;
}
input,textarea{
  padding:13px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.12);
  background:#000;
  color:#fff;
}
textarea{grid-column:1/-1}
.form button{
  grid-column:1/-1;
  padding:15px;
  border-radius:16px;
  border:none;
  background:#22c55e;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

/* PRODUCTS GRID */
.products{
  padding:18px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:18px;
}

/* CARD */
.card{
  background:rgba(255,255,255,.06);
  border-radius:22px;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

/* FAST IMAGE */
.card img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:16px;
  display:block;
  background:#111;
}

/* DELETE BUTTON */
.card button{
  margin-top:auto;
  padding:10px;
  border:none;
  border-radius:14px;
  background:#ef4444;
  color:#fff;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <h2>JD Product Management</h2>
  <button onclick="location.href='admin-dashboard.html'">Dashboard</button>
</header>

<!-- ADD PRODUCT -->
<div class="form">
  <input id="name" placeholder="Product name">
  <input id="price" type="number" placeholder="Price">
  <input id="category" placeholder="Category">
  <input id="img1" placeholder="Image URL 1 (optional)">
  <input id="img2" placeholder="Image URL 2 (optional)">
  <input id="img3" placeholder="Image URL 3 (optional)">
  <textarea id="desc" rows="3" placeholder="Description (optional)"></textarea>
  <button id="addBtn">Add Product</button>
</div>

<!-- PRODUCTS -->
<div class="products" id="list"></div>

<script>
/* ================= CONFIG ================= */
const API_BASE = "https://shopx-production-b1ad.up.railway.app/api";
const PUBLIC_PRODUCTS_API = API_BASE + "/products";
const ADMIN_PRODUCTS_API = API_BASE + "/admin/products";

const FALLBACK_IMAGE =
  "https://via.placeholder.com/600x400?text=No+Image";

/* ================= AUTH ================= */
const token = localStorage.getItem("adminToken");
if (!token) location.href = "admin-login.html";

/* ================= ELEMENTS ================= */
const list = document.getElementById("list");
const addBtn = document.getElementById("addBtn");

const nameInput = document.getElementById("name");
const priceInput = document.getElementById("price");
const categoryInput = document.getElementById("category");
const img1Input = document.getElementById("img1");
const img2Input = document.getElementById("img2");
const img3Input = document.getElementById("img3");
const descInput = document.getElementById("desc");

/* ================= LOAD PRODUCTS ================= */
async function loadProducts(){
  list.innerHTML = "";

  let res;
  try{
    res = await fetch(PUBLIC_PRODUCTS_API);
  }catch{
    alert("Server unreachable");
    return;
  }

  const products = await res.json();

  products.forEach(p=>{
    let images = [];

    // SAFE NORMALIZATION
    if(Array.isArray(p.images)){
      images = p.images;
    }else if(typeof p.images === "string"){
      try{
        images = JSON.parse(p.images);
      }catch{
        images = [];
      }
    }

    // REMOVE EMPTY URLS
    images = images.filter(i => typeof i === "string" && i.trim());

    const imgSrc = images[0] || FALLBACK_IMAGE;

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img
        src="${imgSrc}"
        width="300"
        height="150"
        loading="lazy"
        decoding="async"
        fetchpriority="low"
        onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}'"
      >
      <strong>${p.name}</strong>
      <span>₹${p.price}</span>
      <small>${p.category}</small>
      <button>Delete</button>
    `;

    card.querySelector("button").onclick = () => deleteProduct(p.id);
    list.appendChild(card);
  });
}

/* ================= ADD PRODUCT ================= */
addBtn.onclick = async ()=>{
  const payload = {
    name: nameInput.value.trim(),
    price: Number(priceInput.value),
    category: categoryInput.value.trim(),
    description: descInput.value.trim(),
    image1: img1Input.value.trim(),
    image2: img2Input.value.trim(),
    image3: img3Input.value.trim()
  };

  if(!payload.name || !payload.category || isNaN(payload.price)){
    alert("Name, price and category required");
    return;
  }

  const res = await fetch(ADMIN_PRODUCTS_API,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization:"Bearer "+token
    },
    body:JSON.stringify(payload)
  });

  const data = await res.json();
  if(!res.ok) return alert(data.message || "Add failed");

  clearForm();
  loadProducts();
};

/* ================= DELETE PRODUCT ================= */
async function deleteProduct(id){
  if(!confirm("Delete product?")) return;

  const res = await fetch(`${ADMIN_PRODUCTS_API}/${id}`,{
    method:"DELETE",
    headers:{ Authorization:"Bearer "+token }
  });

  if(!res.ok){
    alert("Delete failed");
    return;
  }

  loadProducts();
}

/* ================= HELPERS ================= */
function clearForm(){
  [
    nameInput,priceInput,categoryInput,
    img1Input,img2Input,img3Input,descInput
  ].forEach(i=>i.value="");
}

loadProducts();
</script>

</body>
</html>
