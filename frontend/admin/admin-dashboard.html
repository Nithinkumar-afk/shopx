<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | JD</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Poppins,sans-serif;
  background:black;
  color:white;
  min-height:100vh;
}
header{
  position:sticky;top:0;z-index:10;
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 22px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.15);
}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{
  width:42px;height:42px;border-radius:14px;
  background:linear-gradient(135deg,#4fb6e8,#2563eb);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:18px;
}
header h2{font-size:18px;font-weight:600}
header button{
  background:#ef4444;border:none;color:white;
  padding:10px 18px;border-radius:14px;
  cursor:pointer;font-weight:600;
}
header button:hover{background:#dc2626}
.container{max-width:1200px;margin:auto;padding:26px 20px}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}
.card{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.15);
  border-radius:20px;
  padding:22px;
  box-shadow:0 20px 50px rgba(0,0,0,.7);
}
.card h3{font-size:14px;font-weight:500;color:#cbd5e1}
.card p{margin-top:12px;font-size:28px;font-weight:600}
.links{
  margin-top:34px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}
.links a{
  text-decoration:none;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:18px;
  padding:18px 20px;
  color:white;
  font-weight:500;
  display:flex;
  justify-content:space-between;
}
.section{margin-top:40px}
.section h3{margin-bottom:16px;font-size:18px}
.order{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}
.order small{display:block;margin-top:4px;color:#cbd5e1}
</style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">JD</div>
    <h2>JD Admin Dashboard</h2>
  </div>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

  <div class="cards">
    <div class="card"><h3>Total Products</h3><p id="totalProducts">—</p></div>
    <div class="card"><h3>Total Orders</h3><p id="totalOrders">—</p></div>
    <div class="card"><h3>Total Users</h3><p id="totalUsers">—</p></div>
    <div class="card"><h3>Total Revenue</h3><p id="totalRevenue">—</p></div>
  </div>

  <div class="links">
    <a href="admin-products.html">📦 Manage Products →</a>
    <a href="admin-orders.html">🧾 View Orders →</a>
    <a href="admin-users.html">👥 Users →</a>
  </div>

  <div class="section">
    <h3>Recent Orders</h3>
    <div id="recentOrders"></div>
  </div>

</div>

<script>
"use strict";

/* ======================
   AUTH GUARD (HARD)
====================== */
const token = localStorage.getItem("adminToken");
if (!token) {
  location.replace("admin-login.html");
}

/* ======================
   FETCH WRAPPER
====================== */
async function authFetch(url) {
  const res = await fetch(url, {
    headers: { Authorization: "Bearer " + token }
  });

  if (res.status === 401 || res.status === 403) {
    forceLogout();
    throw new Error("Unauthorized");
  }
  return res.json();
}

/* ======================
   LOAD DASHBOARD
====================== */
(async () => {
  try {
    const stats = await authFetch("http://localhost:5000/api/admin/stats");
    document.getElementById("totalProducts").innerText = stats.products;
    document.getElementById("totalOrders").innerText = stats.orders;
    document.getElementById("totalUsers").innerText = stats.users;
    document.getElementById("totalRevenue").innerText = "₹" + stats.revenue;

    const orders = await authFetch("http://localhost:5000/api/admin/recent-orders");
    const recent = document.getElementById("recentOrders");
    recent.innerHTML = orders.length
      ? orders.map(o => `
        <div class="order">
          <strong>${o.name}</strong> (${o.phone})
          <small>₹${o.total} • ${new Date(o.created_at).toLocaleDateString()}</small>
        </div>
      `).join("")
      : "<p>No recent orders</p>";

  } catch (err) {
    console.error(err);
  }
})();

/* ======================
   LOGOUT
====================== */
function logout() {
  forceLogout();
}

function forceLogout() {
  localStorage.removeItem("adminToken");
  location.replace("admin-login.html");
}
</script>

</body>
</html>
