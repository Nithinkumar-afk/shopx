<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Successful | JD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Poppins,sans-serif;
  background:radial-gradient(circle at top,#0f172a,#020617);
  color:#f8fafc;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ===============================
   CONTAINER
================================ */
.container{
  width:100%;
  max-width:720px;
  margin:40px 18px;
  background:rgba(255,255,255,.07);
  backdrop-filter:blur(20px);
  border-radius:26px;
  padding:28px;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 25px 60px rgba(0,0,0,.45)
}

/* ===============================
   SUCCESS HEADER
================================ */
.success{
  text-align:center;
  margin-bottom:26px
}

.success h1{
  color:#22c55e;
  margin-bottom:8px;
  font-size:24px;
  font-weight:600
}

.order-id{
  margin-top:10px;
  color:#94a3b8;
  font-size:14px
}

/* ===============================
   ITEMS
================================ */
#orderItems{
  margin-top:16px
}

.item{
  background:rgba(255,255,255,.08);
  padding:16px;
  border-radius:18px;
  margin-top:14px;
  border:1px solid rgba(255,255,255,.12);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px
}

.item div{
  font-size:14px;
  color:#e5e7eb
}

/* ===============================
   TOTAL
================================ */
.total{
  text-align:right;
  font-size:18px;
  font-weight:600;
  margin-top:26px;
  color:#22c55e
}

/* ===============================
   ACTION BUTTONS
================================ */
.actions{
  margin-top:34px;
  display:flex;
  gap:16px
}

.actions a{
  flex:1;
  text-align:center;
  padding:14px;
  border-radius:16px;
  text-decoration:none;
  font-weight:600;
  transition:.25s
}

.actions a:hover{
  transform:translateY(-2px);
  opacity:.95
}

.home{
  background:linear-gradient(135deg,#38bdf8,#2563eb);
  color:#fff
}

.orders{
  background:rgba(255,255,255,.12);
  color:#f8fafc;
  border:1px solid rgba(255,255,255,.2)
}

/* ===============================
   RESPONSIVE DESIGN
================================ */

/* Mobile */
@media(max-width:600px){
  body{
    align-items:flex-start
  }

  .container{
    margin:24px 14px;
    padding:22px
  }

  .success h1{
    font-size:20px
  }

  .item{
    flex-direction:column;
    align-items:flex-start
  }

  .total{
    font-size:16px
  }

  .actions{
    flex-direction:column
  }
}

/* Tablet */
@media(min-width:601px) and (max-width:900px){
  .container{
    margin:30px 22px
  }
}

/* Large screens */
@media(min-width:1200px){
  .container{
    max-width:760px
  }
}
</style>
</head>

<body>

<div class="container" id="app">
  <div class="success">
    <h1>✅ Order Placed Successfully</h1>
    <div class="order-id">
      Order ID: <b>#<span id="orderId"></span></b>
    </div>
  </div>

  <div id="orderItems"></div>

  <div class="total">
    Total Paid: <span id="orderTotal"></span>
  </div>

  <div class="actions">
    <a href="../index.html" class="home">Continue Shopping</a>
    <a href="orders.html" class="orders">View Orders</a>
  </div>
</div>

<script>
const checkoutBtn = document.getElementById("placeOrder");

checkoutBtn.addEventListener("click", async () => {
  const cart = JSON.parse(localStorage.getItem("checkout_cart")) || [];
  if (!cart.length) {
    alert("Your cart is empty");
    return;
  }

  const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);

  try {
    const res = await fetch("http://localhost:5000/api/orders", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        items: cart,
        total
      })
    });

    const data = await res.json();

    if (!data.success) {
      alert(data.error || "Order failed");
      return;
    }

    localStorage.setItem("last_order", JSON.stringify({
      id: data.orderId,
      total: total,
      items: cart
    }));

    localStorage.removeItem("checkout_cart");
    location.href = "success.html";

  } catch (err) {
    console.error(err);
    alert("Server error. Please try again.");
  }
});
</script>

</body>
</html>
